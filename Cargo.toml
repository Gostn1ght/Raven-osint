[workspace]
members = [
    "ravens-server",
    "ravens-client/src-tauri",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Ravens Nexus Team"]
license      = "MIT"
rust-version = "1.78"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }

# Web server
axum         = { version = "0.7", features = ["ws", "multipart"] }
tower        = { version = "0.4" }
tower-http   = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Database
sqlx         = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }

# HTTP client
reqwest      = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Auth / Crypto
jsonwebtoken = "9"
argon2       = "0.5"
uuid         = { version = "1", features = ["v4", "serde"] }
rand         = "0.8"
aes-gcm      = "0.10"
sha2         = "0.10"
hex          = "0.4"

# Error handling
anyhow       = "1"
thiserror    = "1"

# Logging
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy      = "0.15"
config       = "0.14"

# Time
chrono       = { version = "0.4", features = ["serde"] }

# Misc
base64       = "0.22"
url          = "2"
regex        = "1"
once_cell    = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
