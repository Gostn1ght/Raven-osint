name: Build Ravens Nexus

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Build Server ──────────────────────────────────────────────────────────
  build-server:
    name: Server — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            ext: ""
          - target: x86_64-apple-darwin
            runner: macos-13
            ext: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            ext: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (ARM Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ravens-nexus
          key: ${{ matrix.target }}

      - name: Build server binary
        working-directory: ravens-nexus
        run: |
          cargo build --release --bin ravens-nexus-server --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: |
            ravens-nexus/target/${{ matrix.target }}/release/ravens-nexus-server${{ matrix.ext }}
          retention-days: 1

  # ─── Build Tauri Client ────────────────────────────────────────────────────
  build-client:
    name: Client — ${{ matrix.platform }}
    needs: build-server
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            server-artifact: server-x86_64-pc-windows-msvc
            server-bin: ravens-nexus-server.exe
          - platform: linux
            runner: ubuntu-22.04
            server-artifact: server-x86_64-unknown-linux-gnu
            server-bin: ravens-nexus-server
          - platform: macos-intel
            runner: macos-13
            server-artifact: server-x86_64-apple-darwin
            server-bin: ravens-nexus-server
          - platform: macos-arm
            runner: macos-14
            server-artifact: server-aarch64-apple-darwin
            server-bin: ravens-nexus-server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.server-artifact }}
          path: ravens-nexus/ravens-client/src-tauri/

      - name: Make server executable (Unix)
        if: matrix.platform != 'windows'
        run: chmod +x ravens-nexus/ravens-client/src-tauri/${{ matrix.server-bin }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ravens-nexus/ravens-client/src-tauri

      - name: Install frontend dependencies
        working-directory: ravens-nexus/ravens-client
        run: pnpm install

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ravens-nexus/ravens-client
          tauriScript: pnpm tauri

      - name: Upload client bundles
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}
          path: |
            ravens-nexus/ravens-client/src-tauri/target/release/bundle/
          retention-days: 7

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-server, build-client]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
